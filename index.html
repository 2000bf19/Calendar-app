<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172554">
<title>근무달력 v1.0</title>
<style>
:root{--bg:#f3f6fb;--panel:#fff;--ink:#172033;--muted:#64748b;--line:#dbe3ef;--navy:#172554;--blue:#2563eb;--off:#fee2e2;--offink:#991b1b;--work:#dcfce7;--workink:#166534;--today:#fef3c7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{max-width:1000px;margin:0 auto;padding:18px}
header{background:var(--navy);color:#fff;border-radius:18px;padding:20px;margin-bottom:16px}
h1{font-size:clamp(24px,5vw,34px);margin:0 0 5px} header p{margin:0;color:#dbeafe}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px #0f172a0a}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,input,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
button{cursor:pointer}button.primary,.team.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.month-label{font-size:22px;font-weight:800;min-width:130px;text-align:center}
.teams{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.team{min-width:44px;font-weight:800}
.note{font-size:13px;color:var(--muted);line-height:1.55;margin:10px 0 0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:12px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.weekday{text-align:center;font-weight:800;color:var(--muted);padding:8px 0}
.day{min-height:100px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px;display:flex;flex-direction:column;gap:7px;min-width:0}
.day.out{opacity:.42;background:#f8fafc}.day.today{outline:3px solid #f59e0b;outline-offset:-2px;background:var(--today)}
.date{font-size:13px;font-weight:750}.pattern{font-size:clamp(12px,2vw,16px);font-weight:850;letter-spacing:.3px;overflow-wrap:anywhere}
.status{font-size:11px;font-weight:750;border-radius:7px;padding:4px 5px;width:max-content;max-width:100%}
.status.off{background:var(--off);color:var(--offink)}.status.work{background:var(--work);color:var(--workink)}
.today-tag{font-size:10px;color:#92400e;font-weight:800}
@media(max-width:600px){main{padding:10px}.panel{padding:11px}.day{min-height:78px;padding:5px;gap:5px}.date{font-size:11px}.status{font-size:10px;padding:3px}.weekday{font-size:12px}}
</style>

<body>
<main>
<header>
  <h1>근무달력 <span style="font-size:.55em;font-weight:600">v1.0</span></h1>
  <p>주간/오후 휴무조 · 9개 조 순환 패턴</p>
</header>
<section class="panel">
  <div class="toolbar">
    <button id="prev" aria-label="이전 달">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="next" aria-label="다음 달">›</button>
    <input id="monthInput" type="month" aria-label="연월 선택">
    <button class="primary" id="go">이동</button>
    <button id="todayBtn">오늘</button>
  </div>
  <div class="teams" id="teams" aria-label="조 선택"></div>
  <p class="note">조를 선택하면 해당 조가 휴무조에 포함된 날짜는 ‘휴무’, 포함되지 않은 날짜는 ‘근무’로 표시됩니다. 선택한 조는 이 기기에 저장됩니다.</p>
</section>
<section class="panel">
  <div class="legend">
    <span><i class="dot" style="background:#fecaca"></i>휴무</span>
    <span><i class="dot" style="background:#bbf7d0"></i>근무</span>
    <span>노란색 테두리: 오늘</span>
  </div>
  <div class="calendar" id="calendar"></div>
  <p class="note">계산 기준: 2026년 6월 1일부터 확인된 63일 패턴을 연속 반복합니다. 제공된 2026년 6~8월 달력의 날짜별 휴무조를 기준으로 하며, 이후 날짜는 같은 주기가 반복된다는 계산값입니다.</p>
</section>
<footer class="note" style="text-align:center;padding:8px">근무달력 v1.0 · 패턴 기준일 2026.06.01 · 63일 순환</footer>
</main>
<script>
const cycle = ["EF","GH","IA","IAB","CDE","FGH","FGH","IA","BC","DE","DEF","GHI","ABC","ABC","DE","FG","HI","HIA","BCD","EFG","EFG","HI","AB","CD","CDE","FGH","IAB","IAB","CD","EF","GH","GHI","ABC","DEF","DEF","GH","IA","BC","BCD","EFG","HIA","HIA","BC","DE","FG","FGH","IAB","CDE","CDE","FG","HI","AB","ABC","DEF","GHI","GHI","AB","CD","EF","EFG","HIA","BCD","BCD"];
const anchor = new Date(2026, 5, 1);
const teams = ["A","C","D","F","G","I"];
let selected = localStorage.getItem("workCalendarTeam") || "A";
let view = new Date(2027, 3, 1);
const today = new Date();
function patternFor(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const days = Math.round((d-anchor)/86400000);
  return cycle[((days % cycle.length) + cycle.length) % cycle.length];
}
function renderTeams() {
  const root = document.getElementById("teams"); root.innerHTML = "";
  teams.forEach(t => {
    const b = document.createElement("button");
    b.className = "team" + (selected===t ? " active" : "");
    b.textContent = t+"조"; b.setAttribute("aria-pressed", selected===t);
    b.onclick = () => { selected=t; localStorage.setItem("workCalendarTeam",t); renderTeams(); renderCalendar(); };
    root.appendChild(b);
  });
}
function renderCalendar() {
  const y=view.getFullYear(), m=view.getMonth();
  document.getElementById("monthLabel").textContent = `${y}년 ${m+1}월`;
  document.getElementById("monthInput").value = `${y}-${String(m+1).padStart(2,"0")}`;
  const root=document.getElementById("calendar"); root.innerHTML="";
  ["일","월","화","수","목","금","토"].forEach(w=>{const e=document.createElement("div");e.className="weekday";e.textContent=w;root.appendChild(e);});
  const first=new Date(y,m,1), offset=first.getDay(), days=new Date(y,m+1,0).getDate();
  const total=Math.ceil((offset+days)/7)*7;
  for(let i=0;i<total;i++) {
    const date=new Date(y,m,1-offset+i), inMonth=date.getMonth()===m;
    const p=patternFor(date), off=p.includes(selected);
    const cell=document.createElement("div");
    cell.className="day"+(!inMonth?" out":"")+(date.toDateString()===today.toDateString()?" today":"");
    const dateEl=document.createElement("div"); dateEl.className="date";
    dateEl.textContent=`${date.getMonth()+1}/${date.getDate()}`;
    cell.appendChild(dateEl);
    const pat=document.createElement("div"); pat.className="pattern"; pat.textContent=p; cell.appendChild(pat);
    const status=document.createElement("div"); status.className="status "+(off?"off":"work");
    status.textContent=selected+"조 "+(off?"휴무":"근무"); cell.appendChild(status);
    if(date.toDateString()===today.toDateString()){const tag=document.createElement("div");tag.className="today-tag";tag.textContent="오늘";cell.appendChild(tag);}
    root.appendChild(cell);
  }
}
function shiftMonth(n){view=new Date(view.getFullYear(),view.getMonth()+n,1);renderCalendar();}
document.getElementById("prev").onclick=()=>shiftMonth(-1);
document.getElementById("next").onclick=()=>shiftMonth(1);
document.getElementById("go").onclick=()=>{const v=document.getElementById("monthInput").value;if(v){const [y,m]=v.split("-").map(Number);view=new Date(y,m-1,1);renderCalendar();}};
document.getElementById("monthInput").onchange=e=>{if(e.target.value){const [y,m]=e.target.value.split("-").map(Number);view=new Date(y,m-1,1);renderCalendar();}};
document.getElementById("todayBtn").onclick=()=>{view=new Date(today.getFullYear(),today.getMonth(),1);renderCalendar();};
renderTeams();renderCalendar();
</script>
</body>
</html>
